root = "."
tmp_dir = "tmp"

[build]
  # Просто компилируем main.go из папки cmd
  cmd = "go build -o ./tmp/main ./cmd/main.go"
  # Запускаем полученный бинарник
  bin = "./tmp/main"
  # Следим за расширениями
  include_ext = ["go", "tpl", "tmpl", "html", "toml"]
  # Игнорируем ненужные папки
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  # Задержка перед ребилдом, чтобы не спамить при быстром сохранении
  delay = 1000
  # Останавливать старый бинарник при ошибке билда нового
  stop_on_error = true
  # Цветной вывод
  log_color = true

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[screen]
  clear_on_rebuild = false